name: Build APK
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: App name
        required: true
        default: MeuApp
      build_id:
        description: Build ID
        required: true
        default: build
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Extract web content
        run: |
          mkdir -p app/src/main/assets/www
          if [ -f web-content.zip ]; then
            cd app/src/main/assets/www
            unzip -o $GITHUB_WORKSPACE/web-content.zip
            DIRS=($(find . -maxdepth 1 -mindepth 1 -type d))
            if [ ${#DIRS[@]} -eq 1 ] && [ ! -f index.html ]; then
              mv "${DIRS[0]}"/* . 2>/dev/null || true
              mv "${DIRS[0]}"/.* . 2>/dev/null || true
              rmdir "${DIRS[0]}" 2>/dev/null || true
            fi
            cd $GITHUB_WORKSPACE
          fi
          echo "=== Web files ==="
          find app/src/main/assets/www -type f | head -30

      - name: Set app name
        run: |
          NAME="${{ github.event.inputs.app_name }}"
          sed -i "s|>ZipToApk<|>$NAME<|g" app/src/main/res/values/strings.xml

      - name: Build APK
        run: gradle assembleDebug --no-daemon -p .

      - name: Prepare APK
        run: |
          NAME="${{ github.event.inputs.app_name }}"
          cp app/build/outputs/apk/debug/app-debug.apk "${NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: "${{ github.event.inputs.app_name }}-apk"
          path: "${{ github.event.inputs.app_name }}.apk"
          retention-days: 5

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.event.inputs.build_id }}"
          name: "${{ github.event.inputs.app_name }}"
          body: "APK gerado automaticamente."
          files: "${{ github.event.inputs.app_name }}.apk"
          make_latest: true
